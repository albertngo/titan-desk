[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-sync"
version = "0.1.0"
description = "Airtable → Postgres mirror worker for titan-desk (read-only against Airtable)."
requires-python = ">=3.11"
dependencies = [
  "pyairtable>=3,<4",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "Pillow>=11.1",
  "pillow-heif>=1.0",
  "blurhash-python>=1.2",
  "structlog>=24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
]

[project.scripts]
titan-sync = "titan_sync.run:main"

[tool.setuptools.packages.find]
include = ["titan_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Image.Image.getdata is deprecated:DeprecationWarning"]
markers = [
  "db: needs DATABASE_URL pointing at a database with migration 001 applied",
]
