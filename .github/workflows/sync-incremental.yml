name: Sync (incremental)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-requested]

# One running + one queued at most; extra triggers are dropped. This is the debounce.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  incremental:
    runs-on: ubuntu-latest
    # Capped below the 10-minute watermark overlap so a slow run can never outlast it.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/pyproject.toml
      - run: pip install -e sync
      - name: Incremental sync
        working-directory: sync
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SYNC_TRIGGER: ${{ github.event_name }}
        run: python -m titan_sync.run --mode incremental
