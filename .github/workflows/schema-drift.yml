name: Airtable schema drift

on:
  schedule:
    - cron: "40 11 * * 1"   # Mondays, ~07:40 Toronto
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e sync
      - name: Compare live schema to sync/schema_snapshot.json
        id: drift
        working-directory: sync
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          set +e
          python -m titan_sync.schema_snapshot --check > drift.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat drift.txt
      - name: Open an issue on drift
        if: steps.drift.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sync/drift.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Airtable schema changed — decide tiers for new fields',
              body: '```\n' + body + '\n```\nUpdate `platform-settings/airtable.json`, `sync/titan_sync/fields.py`, and `sync/schema_snapshot.json`.',
              labels: ['sync']
            });
