name: DB migrate

on:
  push:
    branches: [main-desk]
    paths:
      - "db/supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (2026-11-26) to the same CLI as ci.yml. "latest" (2.12x+) rejects
          # config.toml's [inbucket] section and failed the 011_ledger push before it ran.
          # Bump both files together, by hand.
          version: 2.121.0
      - run: supabase --workdir db link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase --workdir db db push
