name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-and-sync:
    name: Database + sync worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase --workdir db start -x studio,inbucket,realtime,edge-runtime,logflare,vector,imgproxy
      - name: pgTAP tests
        run: supabase --workdir db test db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/pyproject.toml
      - name: Install worker
        run: pip install -e "sync[dev]"
      - name: Worker tests (unit + roundtrip against local Supabase)
        working-directory: sync
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: pytest -q
      - name: HTTP boundary tests (anon key against local PostgREST)
        working-directory: web
        env:
          SUPABASE_URL: http://127.0.0.1:54321
        run: |
          eval "$(supabase --workdir ../db status -o env | sed 's/^/export /')"
          npm ci
          npm run test:boundary
      - name: Stop Supabase
        if: always()
        run: supabase --workdir db stop --no-backup

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Generated types are current
        run: |
          # Fails if types.gen.ts was edited by hand; regenerate with `make types`.
          git diff --exit-code -- web/src/lib/db/types.gen.ts
