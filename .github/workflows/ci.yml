name: CI

on:
  pull_request:
  push:
    branches: [main-desk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-and-sync:
    name: Database + sync worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase --workdir db start -x studio,inbucket,realtime,edge-runtime,logflare,vector,imgproxy
      - name: pgTAP tests
        run: supabase --workdir db test db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/pyproject.toml
      - name: Install worker
        run: pip install -e "sync[dev]"
      - name: Worker tests (unit + roundtrip against local Supabase)
        working-directory: sync
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: HTTP boundary tests (anon key against local PostgREST)
        working-directory: web
        env:
          SUPABASE_URL: http://127.0.0.1:54321
        run: |
          export SUPABASE_ANON_KEY="$(supabase --workdir ../db status -o env | grep '^ANON_KEY' | cut -d= -f2- | tr -d '"')"
          npm install --no-audit --no-fund
          npm run test:boundary
      - name: Stop Supabase
        if: always()
        run: supabase --workdir db stop --no-backup

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No package-lock.json yet (see web/README.md); switch to `npm ci` + cache once it is committed.
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Production build (what Vercel runs)
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_STORAGE_HOST: 127.0.0.1
